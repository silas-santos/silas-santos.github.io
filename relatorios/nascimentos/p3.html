    troca('p3diferenca', fx.filter(function (r) { return r.Sel; }).map(function (r) { return { Indicador: r.Indicador, Ordem: r.Ordem, Sentido: r.Sentido, Valor: r.Valor, ValorRS: r.ValorRS, Ano: r.Ano }; }));
    var tn = [];
    D.inds.forEach(function (ind, o) {
      D.anos.forEach(function (a) {
        var y = D.v[a][cod], r = rs(a);
        if (y && y.n) tn.push({ Indicador: ind[1], Ordem: o, Ano: a, Serie: 'Município', Valor: (y[ind[0]] || 0) / y.n });
        tn.push({ Indicador: ind[1], Ordem: o, Ano: a, Serie: 'RS', Valor: r[ind[0]] / r.n });
      });
    });
    troca('p3tendencia', tn);
    troca('p3resumo', [{ Texto: resumo(m, x, R, fx) }]);
  }
  function cabecalho(m, x, R) {
    return ['k|PERFIL DO MUNICÍPIO', 'h1|' + m.nome,
            's|' + fmt0(x.n) + ' nascimentos em ' + ano + (ano === D.prelim ? ' (preliminar)' : '') + ' · ' + (x.n / R.n * 100).toFixed(2).replace('.', ',') + '% do RS',
            's|macrorregião de saúde ' + (m.macro || '—')].join('\n');
  }
  function resumo(m, x, R, fx) {
    var meu = fx.filter(function (r) { return r.Sel; }), L = ['k|EM RESUMO'];
    function pos(ind) { var linhas = fx.filter(function (r) { return r.Indicador === ind; }), eu = linhas.filter(function (r) { return r.Sel; })[0]; if (!eu) return null; return linhas.filter(function (r) { return r.Valor < eu.Valor; }).length / linhas.length; }
    var c = meu.filter(function (r) { return r.Indicador === 'Cesárea'; })[0];
    if (c) L.push('n|' + Math.round(c.Valor * 10) + ' de cada 10', 't|bebês de ' + m.nome + ' nasceram de cesárea (' + p1(c.Valor) + '), mais que em ' + Math.round(pos('Cesárea') * 100) + '% dos municípios gaúchos.');
    var melhores = meu.filter(function (r) { return r.Sentido && r.Sentido * (r.Valor - r.ValorRS) > 0.005; }).map(function (r) { return r.Indicador.toLowerCase(); });
    var piores = meu.filter(function (r) { return r.Sentido && r.Sentido * (r.Valor - r.ValorRS) < -0.005; }).map(function (r) { return r.Indicador.toLowerCase(); });
    if (melhores.length) L.push('g|Melhor que o RS em ' + melhores.join(', ') + '.');
    if (piores.length) L.push('r|Pior que o RS em ' + piores.join(', ') + '.');
    if (x.n < 100) L.push('m|Atenção: com ' + x.n + ' nascimentos no ano, os percentuais variam muito de um ano para outro.');
    return L.join('\n');
  }
  window.mockup = { mun: function (c) { cod = c; atualiza(); }, ano: function (a) { ano = a; atualiza(); } };
})();
