    vivos = vivos.filter(function (v) { return !v.morto; });
  }
  // relógio próprio (setInterval): requestAnimationFrame não roda em alguns visualizadores, como o painel do app e abas em segundo plano
  function quadro() { var agora = performance.now(), dt = Math.min(250, agora - ultimo); ultimo = agora; if (tocando) desenha(dt); }
  var relogio = setInterval(quadro, 33);
  // rota só aparece no mês em que tem exportação para aquele destino, ou enquanto um navio ainda está nela (ida ou volta)
  var ativas = {};
  function acende() { var nav = {}; vivos.forEach(function (v) { if (v.el && !v.morto) nav[v.r] = 1; }); CAM.forEach(function (c, k) { c.el.classList.toggle('on', !!(ativas[k] || nav[k])); }); }
  var tAcende = setInterval(acende, 400);

  function vai(i, solto) {
    sel = i; coluna(i); linha(i);
    if (!solto) { vivos.forEach(function (v) { if (v.el) v.el.remove(); }); vivos = []; resto = {}; }
    solta(i);
    reinicia();
  }
  function reinicia() { clearInterval(timer); if (tocando) timer = setInterval(function () { var j = (sel + 1) % N; vai(j, j !== 0); }, msVideo || PASSO); anelMes(); }
  function anelMes() {   // anel em volta do pause: dá uma volta no tempo escolhido por mês e recomeça junto com o mês seguinte
    var a = $('anel'); a.style.setProperty('--t', (msVideo || PASSO) + 'ms');
    a.classList.remove('on'); void a.getBoundingClientRect(); if (tocando) a.classList.add('on');
  }
  var TEMPOS = [3, 4, 5, 10, 15, 20, 30, 45, 60], ti = 1;
  function tempo(k) {
    ti = Math.max(0, Math.min(TEMPOS.length - 1, k)); PASSO = TEMPOS[ti] * 1000;
    $('tempo').textContent = TEMPOS[ti] < 60 ? TEMPOS[ti] + ' s' : '1 min';
    $('menos').classList.toggle('off', ti === 0); $('mais').classList.toggle('off', ti === TEMPOS.length - 1);
    reinicia();
  }
  $('menos').onclick = function () { tempo(ti - 1); };
  $('mais').onclick = function () { tempo(ti + 1); };
  $('play').onclick = function () { tocando = !tocando; this.classList.toggle('on', tocando); this.textContent = tocando ? '❚❚' : '▶'; reinicia(); };

  // tooltip dos destinos
  var tip = $('tip');
  mp.onmousemove = function (e) {
    var p = e.target.closest('.pais'), pt = p && D.nomes_pt[p.dataset.n]; if (!pt || !D.dest_mes[sel][pt]) { tip.style.opacity = 0; return; }
    var b = st.getBoundingClientRect(), s = b.width / 1280;
    tip.innerHTML = '<b>' + pt + '</b><br>' + br(D.dest_mes[sel][pt] / 1e6) + ' mil toneladas em ' + rot(sel);
    tip.style.left = Math.min(900, (e.clientX - b.left) / s + 14) + 'px'; tip.style.top = ((e.clientY - b.top) / s + 14) + 'px'; tip.style.opacity = 1;
  };
  mp.onmouseleave = function () { tip.style.opacity = 0; };

  tempo(ti); vai(0);
  window.__naviosPara = function () { clearInterval(timer); clearInterval(relogio); clearInterval(tAcende); };
  window.painelNavios = { vai: function (i) { vai(i); }, toca: function (on) { tocando = on; $('play').classList.toggle('on', on); $('play').textContent = on ? '❚❚' : '▶'; reinicia(); },
    velocidade: function (m) { msVideo = m; reinicia(); } };
})();
</script>
