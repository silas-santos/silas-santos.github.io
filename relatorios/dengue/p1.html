<style>
html,body{margin:0;padding:0;overflow:hidden;background:#0B0F1A}
#st{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;overflow:hidden;
  background:radial-gradient(ellipse at 30% 35%,#1C1A2B 0%,#0B0F1A 70%);color:#F3EEE6;font-family:'Segoe UI',system-ui,sans-serif;font-size:13px;line-height:1.3}
.ab{position:absolute}
.h1{left:40px;top:18px;font-size:26px;font-weight:700;letter-spacing:.5px}
.h1 b{color:#FFB547;animation:glow 3.2s ease-in-out infinite}
@keyframes glow{50%{text-shadow:0 0 14px rgba(255,181,71,.8)}}
.h2{left:40px;top:54px;font-size:13.5px;color:#A49A8C}
.sim{right:40px;top:20px;text-align:right;font-size:11px;letter-spacing:1.6px;color:#7D7466;line-height:1.7}
.sim b{display:inline-block;padding:3px 10px;border:1px solid #FFB547;border-radius:12px;color:#FFB547;letter-spacing:1.5px;font-size:10.5px}
.pn{background:#141523;border:1px solid #2A2738;border-radius:10px}
.pt{font-size:11.5px;letter-spacing:2.4px;color:#A49A8C;font-weight:700}
.ps{font-size:11.5px;color:#7D7466;letter-spacing:0;font-weight:400;margin-left:8px}
#ctl{left:40px;top:88px;display:flex;align-items:center;gap:6px;user-select:none}
.yr{padding:5px 12px;border-radius:13px;font-size:12px;font-weight:700;color:#7D7466;background:#11121D;border:1px dashed #3A3448;cursor:pointer;transition:all .25s}
.yr:hover{color:#F3EEE6;border-color:#6B5A44}
.yr.on{color:#FFB547;border:1px solid #FFB547;background:#231C14}
#semana{left:290px;top:88px;font-size:13px;color:#A49A8C;line-height:28px}
#semana b{color:#F3EEE6;font-size:17px;margin-right:6px}
#vel{right:40px;top:86px;display:flex;align-items:center;gap:6px;user-select:none}
.stp{width:22px;height:22px;border-radius:11px;border:1px solid #4A3E30;background:#141523;color:#A49A8C;text-align:center;line-height:20px;cursor:pointer;font-size:14px;box-sizing:border-box}
.stp:hover{background:#FFB547;color:#0B0F1A}
.stp.off{opacity:.3;pointer-events:none}
#tempo{min-width:46px;text-align:center;font-size:12px;color:#E8DFD2;font-weight:600;line-height:1.1}
#tempo small{display:block;font-size:8.5px;color:#7D7466;letter-spacing:1px;font-weight:400}
#pw{position:relative;width:28px;height:28px}
#play{position:absolute;left:1px;top:1px;width:26px;height:26px;border-radius:13px;border:1px solid #4A3E30;background:#141523;color:#FFB547;font-size:11px;text-align:center;line-height:25px;cursor:pointer;box-sizing:border-box}

.anel{position:absolute;left:-3px;top:-3px;pointer-events:none;transform:rotate(-90deg)}

.anel.on circle{animation:cont var(--t,.5s) linear infinite}
@keyframes cont{from{stroke-dashoffset:94.2}to{stroke-dashoffset:0}}
#mapa{left:40px;top:126px;width:620px;height:452px}

.mu{stroke:#0B0F1A;stroke-width:.35;transition:fill .35s;cursor:pointer}

.mu.sel{stroke:#FFF2DC;stroke-width:1.6}
.bo{fill:#FFB547;fill-opacity:.45;stroke:#FFD08A;stroke-width:.8;transition:r .35s;pointer-events:none}
.top{fill:none;stroke:#FF6A55;stroke-width:2;pointer-events:none;transform-box:fill-box;transform-origin:center;animation:onda 1.6s ease-out infinite}

#rk{left:676px;top:298px;width:564px;height:280px}

.rr .nm{width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rr .tk{flex:1;height:9px;background:#221F2F;border-radius:5px;overflow:hidden;margin:0 10px}
.rr .br{height:100%;background:linear-gradient(90deg,#7A4628,#FFB547);border-radius:5px;transition:width .35s;position:relative;overflow:hidden}
.rr .br:after{content:'';position:absolute;top:0;bottom:0;width:40px;left:-40px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);animation:brilho 4.5s ease-in-out infinite}
@keyframes brilho{0%{left:-40px}35%,100%{left:110%}}
.rr .vl{width:60px;text-align:right;font-weight:700}
#cv{left:40px;top:592px;width:1200px;height:110px}
#cv svg{position:absolute;left:0;top:0;cursor:pointer}
#gav{left:676px;top:126px;width:564px;height:452px;background:#1A1828;border:1px solid #6B5A44;border-radius:10px;transform:translateX(620px);transition:transform .5s cubic-bezier(.2,.8,.2,1);box-shadow:-18px 0 40px rgba(0,0,0,.5);overflow:hidden}
#gav.on{transform:translateX(0)}
#gav .x{position:absolute;right:12px;top:10px;width:26px;height:26px;border-radius:13px;background:#26233A;text-align:center;line-height:25px;cursor:pointer;color:#A49A8C;font-size:15px}
#gav .x:hover{background:#FFB547;color:#0B0F1A}
.gt{font-size:20px;font-weight:700;color:#F3EEE6;margin-top:4px}
.gg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
.gc{background:#141523;border-radius:8px;padding:8px 10px}

  $('vel').innerHTML = "<div class='stp' id='menos'>−</div><div id='tempo'></div><div class='stp' id='mais'>+</div>" +
    "<div id='pw'><svg class='anel' id='anel' width='34' height='34'><circle cx='17' cy='17' r='15'/></svg><div id='play' title='passar as semanas sozinho'>▶</div></div>";
  var anel = $('anel'), play = $('play');
  function passo() { vai(sem + 1 < nsem(ano) ? sem + 1 : 0); reinicia(); }
  function ms() { return msVideo || TEMPOS[ti] * 1000; }
  function reinicia() { anel.classList.remove('on'); void anel.getBoundingClientRect(); if (tmr) anel.classList.add('on'); }
  function toca(on) { clearInterval(tmr); tmr = null; play.classList.toggle('on', on); play.innerHTML = on ? '❚❚' : '▶'; if (on) tmr = setInterval(passo, ms()); reinicia(); }
  function tempo(i) {
    ti = Math.max(0, Math.min(TEMPOS.length - 1, i)); var t = TEMPOS[ti];
    $('tempo').innerHTML = String(t).replace('.', ',') + ' s<small>POR SEMANA</small>';
    st.style.setProperty('--t', ms() + 'ms');
    $('menos').classList.toggle('off', ti === 0); $('mais').classList.toggle('off', ti === TEMPOS.length - 1);
    if (tmr) toca(true);
  }
  $('menos').onclick = function () { tempo(ti - 1); };
  $('mais').onclick = function () { tempo(ti + 1); };
  play.onclick = function () { toca(!tmr); };
  tempo(ti);
  vai(0);
  var tAuto = setTimeout(function () { if (!tmr) toca(true); }, 2000);
  window.__denguePara = function () { clearInterval(tmr); clearTimeout(tAuto); };
  window.painelDengue = { vai: vai, abre: abre, toca: toca, tempo: tempo, ano: function (a) { ano = a; vai(0); },
    velocidade: function (m) { msVideo = m; st.style.setProperty('--t', m + 'ms'); if (tmr) toca(true); } };
})();
</script>
