    M.forEach(function (m, k) { medidor(k, ocup(m, i), leitos(m, i), D.sih[m][i].int, ref != null ? ocup(m, ref) : null); li += leitos(m, i); it += D.sih[m][i].int; });
    medidor('rs', ocupRS(i), li, it, ref != null ? ocupRS(ref) : null);
    st.querySelectorAll('.g').forEach(function (g) { g.classList.toggle('sel', g.dataset.k !== undefined && +g.dataset.k === msel); });
  }

  // ---------- linhas de ocupação ao longo dos meses (inverno sombreado)
  var LW = 1200, LH = 162, L = 170, Rr = 24, T = 18, B = 26;
  function linhas(i) {
    var mn = 0.35, mx = 0.8, X = function (k) { return L + k / (N - 1) * (LW - L - Rr); }, Y = function (o) { return LH - B - (o - mn) / (mx - mn) * (LH - T - B); };
    var g = "<svg width='" + LW + "' height='" + LH + "'><text x='18' y='26' font-size='11.5' letter-spacing='2.4' font-weight='700' fill='#8FA8A4'>OCUPAÇÃO MÊS A MÊS</text>" +
      "<text x='18' y='44' font-size='11' fill='#5F7A76'>faixa azul = inverno (jun–ago)</text>";
    D.meses.forEach(function (m, k) { var mm = +m.slice(5); if (mm >= 6 && mm <= 8) g += "<rect x='" + (X(k) - (LW - L - Rr) / (N - 1) / 2).toFixed(1) + "' y='" + T + "' width='" + ((LW - L - Rr) / (N - 1)).toFixed(1) + "' height='" + (LH - T - B) + "' fill='#13263A'/>"; });
    [0.4, 0.5, 0.6, 0.7].forEach(function (o) { g += "<line x1='" + L + "' x2='" + (LW - Rr) + "' y1='" + Y(o) + "' y2='" + Y(o) + "' stroke='#16282F'/><text x='" + (L - 8) + "' y='" + (Y(o) + 4) + "' font-size='9.5' fill='#5F7A76' text-anchor='end'>" + o * 100 + '%</text>'; });
    M.forEach(function (m, k) {
      var on = msel < 0 || msel === k, pts = D.meses.map(function (_, j) { return X(j).toFixed(1) + ',' + Y(ocup(m, j)).toFixed(1); }).join(' ');
      g += "<polyline fill='none' stroke='" + (on ? cor(ocup(m, i)) : '#2A4048') + "' stroke-width='" + (msel === k ? 3 : on ? 1.8 : 1.2) + "' stroke-opacity='" + (on ? .95 : .6) + "' points='" + pts + "'/>";
      if (on) g += "<text x='" + (LW - Rr + 4) + "' y='" + (Y(ocup(m, N - 1)) + 3) + "' font-size='9' fill='#8FA8A4'>" + m.slice(0, 3) + '</text>';
    });
    var xs = X(i);
    g += "<line x1='" + xs + "' x2='" + xs + "' y1='" + T + "' y2='" + (LH - B) + "' stroke='#E9F4F1' stroke-opacity='.45' stroke-dasharray='3 3'/>";
    M.forEach(function (m, k) { if (msel < 0 || msel === k) g += "<circle cx='" + xs + "' cy='" + Y(ocup(m, i)).toFixed(1) + "' r='3.6' fill='" + cor(ocup(m, i)) + "' stroke='#08121A'/>"; });
    D.meses.forEach(function (m, k) { if (k % 3 === 0 || k === N - 1) g += "<text x='" + X(k) + "' y='" + (LH - 8) + "' font-size='9.5' fill='#5F7A76' text-anchor='middle'>" + rot(k) + '</text>'; });
    $('lin').innerHTML = g + '</svg>';
    $('lin').querySelector('svg').onclick = function (e) {
      var b = this.getBoundingClientRect(), x = (e.clientX - b.left) / (b.width / LW);
      toca(false); muda(Math.max(0, Math.min(N - 1, Math.round((x - L) / (LW - L - Rr) * (N - 1)))));
    };
  }

  // ---------- gaveta da macrorregião
  var CORES_T = { 'Clínicos': '#4FC3F7', 'Cirúrgicos': '#BA8CFF', 'Obstétrico': '#FF8FB1', 'Pediátrico': '#FFD166', 'Outras Especialidades': '#7FA7FF', 'Hospital/DIA': '#9CCC65' };
  function abre(k) {
    msel = k; var m = M[k], i = sel, s = D.sih[m][i], o = ocup(m, i);
    var tp = D.tipos[m] || {}, tot = 0, uti = 0;
    Object.keys(tp).forEach(function (t) { tot += tp[t]; if (/UTI/i.test(t)) uti += tp[t]; });
    var partes = Object.keys(tp).sort(function (a, b) { return tp[b] - tp[a]; });
    var corT = function (t) { return CORES_T[t] || (/UTI/i.test(t) ? '#FF5E6C' : '#4A6A70'); };
    $('gavc').innerHTML = "<div class='pt'>MACRORREGIÃO DE SAÚDE · " + rot(i).toUpperCase() + "</div><div class='gt' style='color:" + cor(o) + "'>" + m + '</div>' +
      "<div class='gg'><div class='gc'><div class='kl'>OCUPAÇÃO</div><div class='kv' style='color:" + cor(o) + "'>" + f0.format(o * 100) + "<small>%</small></div></div>" +
      "<div class='gc'><div class='kl'>LEITOS SUS</div><div class='kv'>" + f0.format(leitos(m, i)) + "<small>" + f0.format(D.leitos[m][i][1]) + " compl.</small></div></div>" +
      "<div class='gc'><div class='kl'>INTERNAÇÕES</div><div class='kv'>" + f0.format(s.int) + "</div></div>" +
      "<div class='gc'><div class='kl'>PERMANÊNCIA</div><div class='kv'>" + f1.format(s.dias / s.int) + "<small>dias</small></div></div></div>" +
      "<div class='pt' style='margin-top:16px'>TIPOS DE LEITO SUS<span class='ps'>CNES de " + (function (x) { return MA[+x.slice(5) - 1] + '/' + x.slice(2, 4); })(D.tipos_mes) + ' · ' + f0.format(tot) + ' leitos · ' + f0.format(uti) + ' de UTI</span></div>' +
      "<div class='barra'>" + partes.map(function (t) { return "<div title='" + t + "' style='width:" + (tp[t] / tot * 100) + '%;background:' + corT(t) + "'></div>"; }).join('') + '</div>' +
      "<div class='tl'>" + partes.slice(0, 9).map(function (t) { return "<span><i style='background:" + corT(t) + "'></i>" + t + ' ' + f0.format(tp[t]) + '</span>'; }).join('') + '</div>' +
      "<div class='pt' style='margin-top:14px'>LEITOS POR 100 INTERNAÇÕES NO MÊS</div>" +
      "<div style='font-size:13px;color:#8FA8A4;margin-top:6px;line-height:18px'>Em " + rot(i) + ', ' + m + ' tinha <b style="color:#E9F4F1">' + f1.format(leitos(m, i) / s.int * 100) + ' leitos</b> para cada 100 internações; no RS todo, ' +
      f1.format(M.reduce(function (a, x) { return a + leitos(x, i); }, 0) / M.reduce(function (a, x) { return a + D.sih[x][i].int; }, 0) * 100) + '.</div>';
    $('gav').classList.add('on');
    mapa(sel); linhas(sel); medidores(sel);
  }
  $('gx').onclick = function () { msel = -1; $('gav').classList.remove('on'); mapa(sel); linhas(sel); medidores(sel); };

  // ---------- muda o mês + modo TV
  function muda(i) {
    sel = i;
    st.querySelectorAll('.pl').forEach(function (p) { p.classList.toggle('on', +p.dataset.i === i); });
    mapa(i); medidores(i); linhas(i);
    if (msel >= 0) abre(msel);
  }
  var TEMPOS = [1, 2, 3, 5, 10], ti = 2, tmr = null, msVideo = 0;
  $('vel').innerHTML = "<div class='stp' id='menos'>−</div><div id='tempo'></div><div class='stp' id='mais'>+</div>" +
    "<div id='pw'><svg class='anel' id='anel' width='34' height='34'><circle cx='17' cy='17' r='15'/></svg><div id='play' title='passar os meses sozinho'>▶</div></div>";
  var anel = $('anel'), play = $('play');
  function passo() { muda((sel + 1) % N); reinicia(); }
  function ms() { return msVideo || TEMPOS[ti] * 1000; }
  function reinicia() { anel.classList.remove('on'); void anel.getBoundingClientRect(); if (tmr) anel.classList.add('on'); }
  function toca(on) { clearInterval(tmr); tmr = null; play.classList.toggle('on', on); play.innerHTML = on ? '❚❚' : '▶'; if (on) tmr = setInterval(passo, ms()); reinicia(); }
  function tempo(i) {
    ti = Math.max(0, Math.min(TEMPOS.length - 1, i));
    $('tempo').innerHTML = TEMPOS[ti] + ' s<small>POR MÊS</small>';
    st.style.setProperty('--t', ms() + 'ms');
    $('menos').classList.toggle('off', ti === 0); $('mais').classList.toggle('off', ti === TEMPOS.length - 1);
    if (tmr) toca(true);
  }
  $('menos').onclick = function () { tempo(ti - 1); };
  $('mais').onclick = function () { tempo(ti + 1); };
  play.onclick = function () { toca(!tmr); };
  $('gx').addEventListener('click', function () { toca(false); }, true);
  tempo(ti);
  muda(sel);
  var tAuto = setTimeout(function () { if (!tmr && msel < 0) { muda(0); toca(true); } }, 2500);
  window.__leitosPara = function () { clearInterval(tmr); clearTimeout(tAuto); };
  window.painelLeitos = { muda: muda, abre: abre, toca: toca, tempo: tempo, fecha: function () { $('gx').onclick(); },
    velocidade: function (m) { msVideo = m; st.style.setProperty('--t', m + 'ms'); if (tmr) toca(true); } };
})();
</script>
</body></html>
