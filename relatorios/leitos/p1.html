  var M = D.macros, T = D.tipos, N = D.meses.length, sel = N - 1, msel = -1, tsel = -1, U = D.unidade;
  function rot(i) { var p = D.meses[i].split('-'); return MA[+p[1] - 1] + '/' + p[0].slice(2); }
  // ocupação estimada = dias de permanência no mês / (leitos x dias do mês); m = -1 é o RS todo, t = -1 todos os andares
  function soma(arr, m, i, t) {
    var ms = m < 0 ? M : [M[m]], ts = t < 0 ? T.map(function (_, k) { return k; }) : [t], s = 0;

  function ocup(m, i, t) { var l = leitos(m, i, t); return l ? soma(D.dias, m, i, t) / (l * D.dias_mes[i]) : 0; }
  function cor(o) { return o < 0.6 ? '#7FE0A8' : o < 0.75 ? '#F2D64B' : o < 0.85 ? '#FF9F43' : '#FF5E6C'; }
  $('fonte').innerHTML = "<b><span class='vivo'></span>DADOS REAIS · CNES + SIH / DATASUS</b><br>LEITOS SUS DE INTERNAÇÃO E UTI · " + rot(0) + ' A ' + rot(N - 1);

  // ---------- barra de meses

  $('meses').onclick = function (e) { var p = e.target.closest('.pl'); if (p) { toca(false); muda(+p.dataset.i); } };

  // ---------- a cidade: um prédio por macrorregião, andares de baixo para cima na ordem de D.tipos
  var COLS = 14, W = 7, H = 7, G = 2, PX = W + G, PY = H + G, CHAO = 392, LARG = COLS * PX + 10;

      "<text class='pv' data-v='" + m + "' x='" + (x0 + LARG / 2) + "' y='" + (y0 - 16) + "' font-size='22'></text>";
    JAN[m] = [];
    var y = CHAO - 7;
    T.forEach(function (t, k) {
      var n = cap[m][k], lst = [], uti = t === 'UTI';
      for (var j = 0; j < n; j++) {
        var c = j % COLS, r = Math.floor(j / COLS);
        var jx = x0 + 5 + c * PX, jy = y - (r + 1) * PY;
        lst.push("<rect class='ja" + (uti ? ' uti' : '') + "' data-t='" + k + "' x='" + jx + "' y='" + jy + "' width='" + W + "' height='" + H + "'/>");
      }
      var rows = Math.ceil(n / COLS);
      if (uti && n) svg += "<text class='tag' x='" + (x0 + LARG + 4) + "' y='" + (y - rows * PY / 2 + 3) + "'>UTI</text>";
      // embaralha a ordem de acender, sempre igual, para a troca de mês acender e apagar janelas espalhadas
      var idx = lst.map(function (_, j) { return j; });
      for (var a = idx.length - 1; a > 0; a--) { var b = Math.floor(rnd() * (a + 1)), tmp = idx[a]; idx[a] = idx[b]; idx[b] = tmp; }
      svg += "<g data-and='" + k + "'>" + lst.join('') + '</g>';
      JAN[m].push({ ordem: idx });
      y -= rows * PY + 3;
      if (k < T.length - 1 && n) svg += "<line class='laje' x1='" + x0 + "' x2='" + (x0 + LARG) + "' y1='" + (y + 1.5) + "' y2='" + (y + 1.5) + "'/>";
    });
    svg += "<text class='pn' x='" + (x0 + LARG / 2) + "' y='" + (CHAO + 16) + "'>" + m.toUpperCase() + "</text><text class='pq' data-q='" + m + "' x='" + (x0 + LARG / 2) + "' y='" + (CHAO + 30) + "'></text></g>";
  });
  svg += "<rect x='0' y='" + CHAO + "' width='1280' height='2' fill='#22384A'/></svg>";
  $('cid').innerHTML = svg;
  ORD.forEach(function (m) {
    var g = st.querySelector(".pr[data-m='" + M.indexOf(m) + "']");
    T.forEach(function (_, k) { JAN[m][k].els = g.querySelectorAll("[data-and='" + k + "'] .ja"); });
  });
  $('leg').innerHTML = '<b>1 janela = ' + U + ' leitos SUS</b><br><i style="background:#FFD27A"></i>acesa = ocupada<br><i style="background:#FF8F7A"></i>UTI ocupada<br><i style="background:#1A2A38"></i>apagada = livre<br>' +
    '<i style="border:1px dashed #4A6070;box-sizing:border-box"></i>leito que não existia no mês';

  function cidade(i, anim) {
    ORD.forEach(function (m) {
      var k0 = M.indexOf(m);
      T.forEach(function (t, k) {
        var J = JAN[m][k], tem = Math.round(D.leitos[m][i][k] / U), o = Math.min(1, ocup(k0, i, k)), acesas = Math.round(tem * o);
        // as primeiras "tem" janelas existem no mês; dessas, acende "acesas" na ordem embaralhada
        var vivo = {}; for (var a = 0; a < J.ordem.length && Object.keys(vivo).length < acesas; a++) if (J.ordem[a] < tem) vivo[J.ordem[a]] = 1;

          var estava = el.classList.contains('on');

          el.classList.toggle('on', !!vivo[j]);

        });
      });
      var o = ocup(k0, i, -1), tx = st.querySelector("[data-v='" + m + "']");
      tx.textContent = f0.format(o * 100) + '%'; tx.style.fill = cor(o);
      st.querySelector("[data-q='" + m + "']").textContent = f0.format(leitos(k0, i, -1)) + ' leitos · ' + f0.format(D.int[m][i]) + ' intern.';
      var g = st.querySelector(".pr[data-m='" + k0 + "']");
      g.classList.toggle('sel', msel === k0); g.classList.toggle('apaga', msel >= 0 && msel !== k0);
    });
    var o = ocup(-1, i, -1), it = 0; M.forEach(function (m) { it += D.int[m][i]; });
    $('rs').innerHTML = "<div class='k'>RIO GRANDE DO SUL · " + rot(i).toUpperCase() + "</div><div class='v' style='color:" + cor(o) + "'>" + f0.format(o * 100) + "<small style='font-size:16px;color:#8FA8A4'>%</small></div>" +
      "<div class='s'>dos leitos ocupados<br><b style='color:#E9F4F1'>" + f0.format(leitos(-1, i, -1)) + '</b> leitos · <b style="color:#E9F4F1">' + f0.format(it) + '</b> internações</div>';
  }
  // um pisca-pisca leve: de vez em quando uma janela acesa apaga e volta (modo TV)
  var tPisca = setInterval(function () {
    var on = st.querySelectorAll('.ja.on'); if (!on.length) return;

  }, 700);

  var tip = $('tip');
  $('cid').onmousemove = function (e) {

    if (j) { var k = +j.dataset.t; h = '<b>' + m + ' · ' + T[k] + '</b><br>' + f0.format(ocup(k0, i, k) * 100) + '% de ocupação estimada em ' + rot(i) + '<br>' + f0.format(D.leitos[m][i][k]) + ' leitos SUS · ' + f0.format(D.dias[m][i][k]) + ' dias de internação'; }
    else h = '<b>' + m + '</b><br>' + f0.format(ocup(k0, i, -1) * 100) + '% de ocupação estimada em ' + rot(i) + '<br>' + f0.format(leitos(k0, i, -1)) + ' leitos SUS · ' + f0.format(D.int[m][i]) + ' internações';

    tip.style.left = Math.min(1000, (e.clientX - b.left) / s + 14) + 'px'; tip.style.top = Math.min(520, (e.clientY - b.top) / s + 14) + 'px'; tip.style.opacity = 1;
  };
  $('cid').onmouseleave = function () { tip.style.opacity = 0; };
  $('cid').onclick = function (e) { var g = e.target.closest('.pr'); toca(false); msel = g && +g.dataset.m !== msel ? +g.dataset.m : -1; cidade(sel, false); andares(sel); };

  // ---------- andares: ocupação de cada tipo de leito ao longo dos meses (RS ou o prédio escolhido)
  var AW = 191, AH = 60;
  function andares(i) {
    var m = msel, nome = m < 0 ? 'RIO GRANDE DO SUL' : M[m].toUpperCase();
    $('atit').innerHTML = 'CADA ANDAR · <span>' + nome + '</span><em>ocupação estimada por tipo de leito, na ordem dos andares (de cima para baixo) · faixa azul = inverno · clique num prédio para ver só ele</em>';
    var ordem = T.map(function (_, k) { return k; }).reverse();
    $('and').innerHTML = ordem.map(function (k) {
      var o = ocup(m, i, k), ant = i > 0 ? ocup(m, i - 1, k) : null, d = ant == null ? null : (o - ant) * 100;
      var vals = D.meses.map(function (_, j) { return ocup(m, j, k); }), mn = Math.min.apply(null, vals) - .05, mx = Math.max.apply(null, vals) + .05;
      var X = function (j) { return 8 + j / (N - 1) * (AW - 16); }, Y = function (v) { return AH - 6 - (v - mn) / (mx - mn) * (AH - 14); };
      var sv = "<svg width='" + AW + "' height='" + AH + "'>";
      D.meses.forEach(function (x, j) { var mm = +x.slice(5); if (mm >= 6 && mm <= 8) sv += "<rect x='" + (X(j) - (AW - 16) / (N - 1) / 2).toFixed(1) + "' y='4' width='" + ((AW - 16) / (N - 1)).toFixed(1) + "' height='" + (AH - 8) + "' fill='#13263A'/>"; });
      if (.85 > mn && .85 < mx) sv += "<line x1='8' x2='" + (AW - 8) + "' y1='" + Y(.85).toFixed(1) + "' y2='" + Y(.85).toFixed(1) + "' stroke='#FF5E6C' stroke-opacity='.45' stroke-dasharray='3 3'/>";
      sv += "<polyline fill='none' stroke='" + cor(o) + "' stroke-width='1.8' points='" + vals.map(function (v, j) { return X(j).toFixed(1) + ',' + Y(v).toFixed(1); }).join(' ') + "'/>" +
        "<circle cx='" + X(i).toFixed(1) + "' cy='" + Y(o).toFixed(1) + "' r='3.6' fill='" + cor(o) + "' stroke='#0E1C24' stroke-width='1.5'/></svg>";
      return "<div class='an" + (tsel === k ? ' sel' : '') + "' data-k='" + k + "'><div class='t'>" + T[k].toUpperCase() + "</div><div class='v' style='color:" + cor(o) + "'>" + f0.format(o * 100) + '<small>%</small></div>' +
        "<div class='d' style='color:" + (d == null || Math.abs(d) < .5 ? '#8FA8A4' : d > 0 ? '#FF8A8A' : '#7FD8A8') + "'>" + (d == null ? '' : (Math.abs(d) < .5 ? '= ' : d > 0 ? '▲ ' : '▼ ') + f1.format(Math.abs(d)) + ' p.p.<br><span style="font-weight:400;color:#5F7A76">vs mês anterior</span>') + '</div>' +

  }
  $('and').onclick = function (e) {
    var a = e.target.closest('.an'); if (!a) return; toca(false);
    tsel = +a.dataset.k === tsel ? -1 : +a.dataset.k;
    st.querySelectorAll('[data-and]').forEach(function (g) { g.style.opacity = tsel < 0 || +g.dataset.and === tsel ? 1 : .18; });
    andares(sel);
  };

  // ---------- muda o mês + modo TV
  function muda(i, anim) {

  }
  var TEMPOS = [3, 4, 5, 10, 15, 20, 30, 45, 60], ti = 1, tmr = null, msVideo = 0;
  $('vel').innerHTML = "<span class='vt'>TEMPO POR MÊS</span><div class='stp' id='menos'>−</div><div id='tempo'></div><div class='stp' id='mais'>+</div>" +
    "<div id='pw'><svg class='anel' id='anel' width='34' height='34'><circle cx='17' cy='17' r='15'/></svg><div id='play' title='passar os meses sozinho'>▶</div></div>";
  var anel = $('anel'), play = $('play');
  function passo() { muda((sel + 1) % N); reinicia(); }
  function ms() { return msVideo || TEMPOS[ti] * 1000; }
  function reinicia() { anel.classList.remove('on'); void anel.getBoundingClientRect(); if (tmr) anel.classList.add('on'); }
  function toca(on) { clearInterval(tmr); tmr = null; play.classList.toggle('on', on); play.innerHTML = on ? '❚❚' : '▶'; if (on) tmr = setInterval(passo, ms()); reinicia(); }
  function tempo(i) {
    ti = Math.max(0, Math.min(TEMPOS.length - 1, i));
    $('tempo').innerHTML = TEMPOS[ti] + ' s';
    st.style.setProperty('--t', ms() + 'ms');
    $('menos').classList.toggle('off', ti === 0); $('mais').classList.toggle('off', ti === TEMPOS.length - 1);
    if (tmr) toca(true);
  }
  $('menos').onclick = function () { tempo(ti - 1); };
  $('mais').onclick = function () { tempo(ti + 1); };
  play.onclick = function () { toca(!tmr); };
  tempo(ti);
  muda(sel, false);
  var tAuto = setTimeout(function () { if (!tmr && msel < 0) { muda(0); toca(true); } }, 2500);
  window.__predioPara = function () { clearInterval(tmr); clearInterval(tPisca); clearTimeout(tAuto); };
  window.painelPredio = { muda: muda, toca: toca, tempo: tempo,
    escolhe: function (k) { msel = k; cidade(sel, false); andares(sel); },
    velocidade: function (m) { msVideo = m; st.style.setProperty('--t', m + 'ms'); if (tmr) toca(true); } };
})();
